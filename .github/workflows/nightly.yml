name: Nightly Build

on:
  workflow_dispatch:

permissions:
  contents: write

# Share this group with nightly-cleanup.yml to avoid simultaneous changes.
concurrency:
  group: nightly-release
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = $env:GITHUB_SHA.Substring(0, 7)
          $filename = "psmux-nightly-$sha-windows-x64.zip"

          Compress-Archive `
            -Path target/release/psmux.exe, `
                  target/release/pmux.exe, `
                  target/release/tmux.exe `
            -DestinationPath $filename

          "ARCHIVE=$filename" >> $env:GITHUB_ENV

      - name: Publish nightly release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'nightly'
          $sha = $env:GITHUB_SHA
          $shortSha = $sha.Substring(0, 7)
          $asset = $env:ARCHIVE
          $downloadUrl = "https://github.com/$env:GH_REPO/releases/download/$tag/$asset"
          $commitUrl = "https://github.com/$env:GH_REPO/commit/$sha"

          $notes = @"
          # psmux Nightly Build

          **Latest test build:** [$shortSha]($commitUrl)

          **Windows x64:** [Download $asset]($downloadUrl)

          This is a development build for testing, not a stable release.
          Older ZIP files remain available below for regression testing.
          The autogenerated Source code archives are tied to the fixed
          nightly tag and may not match the latest ZIP asset.
          "@
          $notes | Set-Content -Path release-notes.md -Encoding utf8

          # 'gh release view nightly' exits with an error if the release is absent.
          # Instead, list releases: an empty list is a valid first-run state.
          $releaseJson = gh release list --repo $env:GH_REPO `
            --limit 1000 --json tagName,isPrerelease,isDraft
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to list releases; refusing to publish'
          }
          $releases = @($releaseJson | ConvertFrom-Json)
          $nightly = @($releases | Where-Object { $_.tagName -ceq $tag })

          if ($nightly.Count -eq 0) {
            Write-Host 'Nightly release does not exist; creating it.'
            gh release create $tag $asset `
              --repo $env:GH_REPO `
              --target $sha `
              --title 'psmux Nightly Build' `
              --notes-file release-notes.md `
              --prerelease `
              --latest=false
            if ($LASTEXITCODE -ne 0) {
              throw 'Failed to create nightly release'
            }
          } else {
            if ($nightly.Count -ne 1 -or $nightly[0].isDraft -or -not $nightly[0].isPrerelease) {
              throw 'Refusing to update nightly: expected one published pre-release'
            }

            $assetNames = @(gh release view $tag --repo $env:GH_REPO `
              --json assets --jq '.assets[].name')
            if ($LASTEXITCODE -ne 0) {
              throw 'Failed to list nightly release assets'
            }
            if ($assetNames -notcontains $asset) {
              gh release upload $tag $asset --repo $env:GH_REPO
              if ($LASTEXITCODE -ne 0) {
                throw 'Failed to upload nightly ZIP; previous build remains available'
              }
            } else {
              Write-Host "Already uploaded: $asset (skipping upload)"
            }

            # Update the recommendation only after a new ZIP is available.
            gh release edit $tag `
              --repo $env:GH_REPO `
              --title 'psmux Nightly Build' `
              --notes-file release-notes.md `
              --prerelease `
              --latest=false
            if ($LASTEXITCODE -ne 0) {
              throw 'Failed to update nightly release notes'
            }
          }
