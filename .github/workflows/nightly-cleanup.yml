name: Nightly Cleanup

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Stable release tag whose history is used for cleanup (e.g. v3.4.0)'
        required: true
        type: string
      dry_run:
        description: 'Preview only; do not edit release notes or delete assets'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

# This must match nightly.yml, so publishing and cleanup cannot overlap.
concurrency:
  group: nightly-release
  cancel-in-progress: false

jobs:
  cleanup:
    # Do not process pre-releases or drafts on the automatic path.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' &&
       github.event.release.prerelease == false &&
       github.event.release.draft == false)
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete Git history and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Preview or clean up incorporated nightly assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PUBLISHED_TAG: ${{ github.event.release.tag_name }}
          MANUAL_TAG: ${{ inputs.release_tag }}
          MANUAL_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = if ($env:EVENT_NAME -eq 'release') { $env:PUBLISHED_TAG } else { $env:MANUAL_TAG }
          $dryRun = ($env:EVENT_NAME -eq 'workflow_dispatch' -and $env:MANUAL_DRY_RUN -eq 'true')

          if ([string]::IsNullOrWhiteSpace($tag) -or $tag -notmatch '^[A-Za-z0-9][A-Za-z0-9._-]*$') {
            throw "Invalid stable release tag: $tag"
          }
          Write-Host "Repository: $env:GH_REPO"
          Write-Host "Stable tag: $tag"
          Write-Host "Dry run: $dryRun"

          # Validate that the reference is a *published stable* GitHub release.
          $stableJson = gh release view $tag --json tagName,isPrerelease,isDraft
          if ($LASTEXITCODE -ne 0) { throw "Unable to read stable release: $tag" }
          $stable = $stableJson | ConvertFrom-Json
          if ($stable.isDraft -or $stable.isPrerelease) {
            throw "Refusing cleanup: $tag is a draft or pre-release, not a stable release"
          }

          # Verify the stable Git tag resolves to an actual commit.
          git fetch --force origin --tags
          if ($LASTEXITCODE -ne 0) { throw 'Failed to fetch release tags' }
          $stableSha = git rev-parse --verify "refs/tags/$tag^{commit}"
          if ($LASTEXITCODE -ne 0) { throw "Could not resolve stable tag $tag to a commit" }
          $stableSha = $stableSha.Trim()
          Write-Host "Stable commit: $stableSha"

          # Only the fixed 'nightly' release is eligible, and only if pre-release.
          $nightlyJson = gh release view nightly --json tagName,isPrerelease,isDraft,isImmutable,assets
          if ($LASTEXITCODE -ne 0) {
            Write-Host 'No nightly release found; nothing to clean up.'
            exit 0
          }
          $nightly = $nightlyJson | ConvertFrom-Json
          if ($nightly.isDraft -or -not $nightly.isPrerelease) {
            throw 'Refusing cleanup: nightly release must be a published pre-release'
          }
          if ($nightly.isImmutable) {
            throw 'Nightly release is immutable; its assets cannot be deleted'
          }

          # Match only ZIP assets generated by nightly.yml. Other assets are untouched.
          $pattern = '^psmux-nightly-([0-9a-fA-F]{7})-windows-x64\.zip$'
          $eligible = @($nightly.assets | Where-Object { $_.name -match $pattern })
          $toDelete = @()
          $kept = @()
          foreach ($asset in $eligible) {
            $null = $asset.name -match $pattern
            $shortSha = $Matches[1]
            $candidate = git rev-parse --verify "$shortSha^{commit}" 2>$null
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Skipping $($asset.name): commit not found or ambiguous"
              $kept += $asset
              continue
            }
            $candidate = $candidate.Trim()
            git merge-base --is-ancestor $candidate $stableSha
            if ($LASTEXITCODE -eq 0) {
              $toDelete += $asset
              Write-Host "DELETE candidate: $($asset.name) ($candidate)"
            } elseif ($LASTEXITCODE -eq 1) {
              $kept += $asset
              Write-Host "KEEP (not in stable): $($asset.name)"
            } else {
              throw "Git ancestry check failed for $($asset.name)"
            }
          }

          Write-Host "Eligible ZIPs: $($eligible.Count); cleanup candidates: $($toDelete.Count); retained: $($kept.Count)"
          @(
            "## Nightly cleanup ($tag)"
            "- Mode: $(if ($dryRun) { 'DRY RUN' } else { 'DELETE' })"
            "- Stable commit: $stableSha"
            "- Candidates: $($toDelete.Count)"
            "- Retained nightly ZIPs: $($kept.Count)"
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          foreach ($a in $toDelete) {
            "- $(if ($dryRun) { 'Would delete' } else { 'Delete' }): ``$($a.name)``" |
              Add-Content -Path $env:GITHUB_STEP_SUMMARY
          }

          if ($dryRun) {
            Write-Host 'DRY RUN: No assets or release notes were changed.'
            exit 0
          }
          if ($toDelete.Count -eq 0) {
            Write-Host 'Nothing to delete.'
            exit 0
          }

          # Update the recommended link BEFORE deleting ZIP files, so it never
          # points to one of the files being removed. Old ZIPs remain available
          # if a subsequent deletion fails.
          $latest = $kept | Sort-Object createdAt -Descending | Select-Object -First 1
          if ($null -ne $latest) {
            $latestName = $latest.name
            $null = $latestName -match $pattern
            $latestShortSha = $Matches[1]
            $targetUrl = "https://github.com/$env:GH_REPO/releases/download/nightly/$latestName"
            $commitUrl = "https://github.com/$env:GH_REPO/commit/$latestShortSha"
            $currentInfo = "**Latest available nightly:** [$latestShortSha]($commitUrl)"
            $downloadInfo = "**Windows x64:** [Download $latestName]($targetUrl)"
          } else {
            $stableUrl = "https://github.com/$env:GH_REPO/releases/tag/$tag"
            $currentInfo = '**No newer nightly build is currently available.**'
            $downloadInfo = "The previous test builds are included in [stable $tag]($stableUrl)."
          }
          $notes = @"
          # psmux Nightly Build

          $currentInfo

          $downloadInfo

          Development builds are for testing, not stable releases.
          Previous nightly ZIPs that are ancestors of the stable release are
          periodically removed. The automatically generated Source code archives
          correspond to the fixed nightly tag, not necessarily the ZIP assets.
          "@
          $notes | Set-Content -Path release-notes.md -Encoding utf8
          gh release edit nightly --notes-file release-notes.md --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Could not update the nightly release notes; no files deleted' }

          foreach ($asset in $toDelete) {
            gh release delete-asset nightly $asset.name --yes
            if ($LASTEXITCODE -ne 0) { throw "Failed to delete $($asset.name)" }
            Write-Host "Deleted: $($asset.name)"
          }

